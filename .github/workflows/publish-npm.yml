name: Publish release artifacts

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and pack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      package_name: ${{ steps.release.outputs.package_name }}
      package_version: ${{ steps.release.outputs.package_version }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify the release source and metadata
        id: release
        env:
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "Release tag must point to a commit contained in origin/main." >&2
            exit 1
          }
          node scripts/check-release.mjs \
            --tag "$RELEASE_TAG" \
            --prerelease "$RELEASE_IS_PRERELEASE"

      - name: Install locked dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Audit dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org/

      - name: Run static checks
        run: npm run check

      - name: Run unit and release-gate tests
        run: |
          npm run test:unit
          npm run test:release

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        env:
          TMPDIR: /tmp
        run: npm run test:e2e

      - name: Test the packed package from outside the repository
        env:
          TMPDIR: /tmp
        run: npm run test:package

      - name: Build and test the release container
        run: npm run test:container

      - name: Create the release tarball
        run: |
          mkdir release-artifact
          npm pack \
            --pack-destination release-artifact \
            --registry=https://registry.npmjs.org/

      - name: Dry-run the release tarball publication
        run: |
          shopt -s nullglob
          packages=(./release-artifact/*.tgz)
          [[ ${#packages[@]} -eq 1 ]] || {
            echo "Expected exactly one release tarball." >&2
            exit 1
          }
          npm publish "${packages[0]}" \
            --dry-run \
            --json \
            --registry=https://registry.npmjs.org/ \
            --tag "${{ steps.release.outputs.dist_tag }}"

      - name: Upload the validated tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: release-artifact/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish npm package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download the validated tarball
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: npm-package
          path: release-artifact

      - name: Publish to npm
        run: |
          shopt -s nullglob
          packages=(./release-artifact/*.tgz)
          [[ ${#packages[@]} -eq 1 ]] || {
            echo "Expected exactly one validated release tarball." >&2
            exit 1
          }
          npm publish "${packages[0]}" \
            --registry=https://registry.npmjs.org/ \
            --tag "${{ needs.validate.outputs.dist_tag }}"

  publish-container:
    name: Publish Docker image
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image metadata
        id: container-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.validate.outputs.package_version }},priority=1000
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
            type=raw,value=next,enable=${{ github.event.release.prerelease == true }}
          labels: |
            org.opencontainers.image.title=Narraeon
            org.opencontainers.image.description=A local-first workspace for living worlds.
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push the multi-platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.container-metadata.outputs.tags }}
          labels: ${{ steps.container-metadata.outputs.labels }}
          annotations: ${{ steps.container-metadata.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-container
          cache-to: type=gha,mode=max,scope=release-container
