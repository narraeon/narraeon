name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and pack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      package_name: ${{ steps.release.outputs.package_name }}
      package_version: ${{ steps.release.outputs.package_version }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify the release source and metadata
        id: release
        env:
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "Release tag must point to a commit contained in origin/main." >&2
            exit 1
          }
          node scripts/check-release.mjs \
            --tag "$RELEASE_TAG" \
            --prerelease "$RELEASE_IS_PRERELEASE"

      - name: Install locked dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Audit dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org/

      - name: Run static checks
        run: npm run check

      - name: Run unit and release-gate tests
        run: |
          npm run test:unit
          npm run test:release

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        env:
          TMPDIR: /tmp
        run: npm run test:e2e

      - name: Test the packed package from outside the repository
        env:
          TMPDIR: /tmp
        run: npm run test:package

      - name: Create the release tarball
        run: |
          mkdir release-artifact
          npm pack \
            --pack-destination release-artifact \
            --registry=https://registry.npmjs.org/

      - name: Dry-run the release tarball publication
        run: |
          shopt -s nullglob
          packages=(release-artifact/*.tgz)
          [[ ${#packages[@]} -eq 1 ]] || {
            echo "Expected exactly one release tarball." >&2
            exit 1
          }
          npm publish "${packages[0]}" \
            --dry-run \
            --json \
            --registry=https://registry.npmjs.org/ \
            --tag "${{ steps.release.outputs.dist_tag }}"

      - name: Upload the validated tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: release-artifact/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download the validated tarball
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: npm-package
          path: release-artifact

      - name: Configure the one-time first-publish token when present
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          if [[ -n "$NPM_BOOTSTRAP_TOKEN" ]]; then
            npm config set \
              "//registry.npmjs.org/:_authToken=$NPM_BOOTSTRAP_TOKEN" \
              --location=user
            echo "Using the one-time npm bootstrap token. Remove it after this release."
          else
            echo "No bootstrap token configured; npm will use trusted publishing (OIDC)."
          fi

      - name: Publish to npm
        run: |
          shopt -s nullglob
          packages=(release-artifact/*.tgz)
          [[ ${#packages[@]} -eq 1 ]] || {
            echo "Expected exactly one validated release tarball." >&2
            exit 1
          }
          npm publish "${packages[0]}" \
            --registry=https://registry.npmjs.org/ \
            --tag "${{ needs.validate.outputs.dist_tag }}"

      - name: Remove bootstrap credentials from the runner
        if: always()
        run: >-
          npm config delete
          //registry.npmjs.org/:_authToken
          --location=user
